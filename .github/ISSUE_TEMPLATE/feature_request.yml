name: "✨ Feature Request"
description: "새로운 기능을 제안하거나 기능을 개선하고 싶을 때 사용하세요."
labels: ["type:feat"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: "기능 개요"
      description: "어떤 기능을 만들고 싶나요?"
      placeholder: "예: 소셜 로그인 기능을 추가합니다."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "필요성"
      description: "왜 이 기능이 필요한가요?"
      placeholder: "사용자 편의성을 높이기 위해 필요합니다."
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "주요 작업 리스트"
      description: "기능 구현을 위해 필요한 세부 작업들을 나열해주세요."
      placeholder: "- [ ] UI 디자인\n- [ ] API 연동"
    validations:
      required: true
