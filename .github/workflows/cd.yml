name: CD (Main Deployment)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: # GitHub 웹 UI에서 수동으로 파이프라인을 실행할 수 있는 버튼을 추가합니다.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stockwellness-front

jobs:
  # 1단계: 도커 이미지 빌드 및 GHCR 푸시
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: string
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_NAME=Stockwellness

  # 2단계: Tailscale 접속 및 n8n 웹훅 트리거
  trigger-deploy:
    name: Trigger n8n Deployment
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3          # v2 → v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Trigger n8n Deployment Webhook (배포 완료 대기)
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          
          JSON_DATA=$(jq -n \
            --arg img "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}" \
            --arg tag "$SHA_SHORT" \
            --arg commit "${{ github.sha }}" \
            --arg msg "$MSG" \
            --arg author "${{ github.actor }}" \
            '{image: $img, tag: $tag, IMAGE_TAG: $tag, commit: $commit, message: $msg, author: $author}')
          
          RESPONSE=$(curl -f \
            --max-time 300 \
            --connect-timeout 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.N8N_DEPLOY_TOKEN }}" \
            -d "$JSON_DATA" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "${{ secrets.N8N_WEBHOOK_URL }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "n8n 응답 코드: ${HTTP_STATUS}"
          echo "n8n 응답 내용: ${BODY}"
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ 배포 실패 (HTTP ${HTTP_STATUS})"
            exit 1
          fi

      - name: Done
        run: echo "✅ Front-End 배포 완료 → ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${GITHUB_SHA:0:7}"
